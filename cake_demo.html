<style>

<script id="fs" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uR;uniform float uT,uYaw,uPit,uDist,uLit,uSm;uniform sampler2D uBand,uPlq,uNm;
float gId,gFl,gSm;
float h1(float n){return fract(sin(n)*43758.5453);}
float h3(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
vec2 mn(vec2 a,vec2 b){return a.x<b.x?a:b;}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float sdCyl(vec3 p,float r,float h){vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h);return min(max(d.x,d.y),0.)+length(max(d,0.));}
float sdRC(vec3 p,float r,float h,float e){vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r-e,h-e);return min(max(d.x,d.y),0.)+length(max(d,0.))-e;}
float sdCap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}
float sdBox(vec3 p,vec3 b,float e){vec3 q=abs(p)-b+e;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-e;}
vec3 rep(vec3 p,float n,float off){float a=atan(p.x,p.z)-off;float s=6.2831853/n;gId=floor(a/s+.5);float la=a-gId*s;float r=length(p.xz);return vec3(sin(la)*r,p.y,cos(la)*r);}
vec2 map(vec3 p){
  vec3 q;float d;vec2 r;
  r=vec2(sdCyl(p-vec3(0.,-.035,0.),3.05,.035),1.);
  r=mn(r,vec2(length(vec2(length(p.xz)-3.05,p.y+.035))-.05,2.));
  d=smin(sdCyl(p-vec3(0.,-.6,0.),.4,.5),sdCyl(p-vec3(0.,-1.12,0.),1.4,.07),.3);r=mn(r,vec2(d,2.));
  d=sdRC(p-vec3(0.,.6,0.),2.2,.6,.07)-.004*sin(atan(p.x,p.z)*90.);r=mn(r,vec2(d,3.));
  q=rep(p-vec3(0.,.1,0.),44.,0.);d=length(q-vec3(0.,0.,2.24))-.09;r=mn(r,vec2(d,mod(gId,2.)<.5?2.:7.));
  q=rep(p-vec3(0.,1.2,0.),36.,0.);d=length(vec3(q.x*1.2,q.y*1.5,(q.z-2.08)*.85))-.12;r=mn(r,vec2(d,3.));
  r=mn(r,vec2(sdRC(p-vec3(0.,1.725,0.),1.55,.525,.06),4.));
  r=mn(r,vec2(sdRC(p-vec3(0.,1.52,0.),1.575,.15,.02),13.));
  q=rep(p-vec3(0.,1.28,0.),34.,0.);d=length(q-vec3(0.,0.,1.6))-.075;r=mn(r,vec2(d,mod(gId,2.)<.5?2.:7.));
  q=rep(p-vec3(0.,2.25,0.),28.,0.);d=length(vec3(q.x*1.2,q.y*1.5,(q.z-1.42)*.85))-.1;r=mn(r,vec2(d,4.));
  r=mn(r,vec2(sdRC(p-vec3(0.,2.7,0.),.95,.45,.05),5.));
  q=rep(p-vec3(0.,2.34,0.),22.,0.);d=length(q-vec3(0.,0.,.99))-.062;r=mn(r,vec2(d,mod(gId,2.)<.5?2.:7.));
  r=mn(r,vec2(sdRC(p-vec3(0.,3.18,0.),.97,.035,.03),6.));
  q=rep(p,13.,0.);d=sdCap(q,vec3(0.,3.18,.955),vec3(0.,3.18-(.1+.4*h1(gId)),.955),.065);r=mn(r,vec2(d,6.));
  q=rep(p,10.,0.);
  if(mod(gId,2.)<.5){vec3 s=q-vec3(0.,3.34,.78);float tp=1.+clamp(s.y,-.2,.2)*2.4;d=(length(vec3(s.x/tp,s.y,s.z/tp)/vec3(.12,.15,.12))-1.)*.1;r=mn(r,vec2(d,8.));r=mn(r,vec2(length(vec3(s.x,(s.y-.15)*3.,s.z))-.08,9.));}
  else{r=mn(r,vec2(length(q-vec3(.07,3.28,.78))-.062,10.));r=mn(r,vec2(length(q-vec3(-.07,3.275,.8))-.058,10.));}
  q=rep(p,5.,.314159);
  r=mn(r,vec2(sdCyl(q-vec3(0.,3.455,.55),.034,.24),11.));
  gFl=sdCap(q,vec3(0.,3.72,.55),vec3(0.,3.8+.02*sin(uT*9.+gId*2.),.55),.028);
  gSm=sdCap(q,vec3(0.,3.74,.55),vec3(.06*sin(uT*2.+gId),3.74+min(uSm,3.5)*.55,.55),.02);
  r=mn(r,vec2(sdBox(p-vec3(0.,3.39,0.),vec3(.4,.17,.022),.02),12.));
  return r;
}
vec2 isect(vec3 ro,vec3 rd,float R,float y0,float y1){
  float a=dot(rd.xz,rd.xz)+1e-6,b=dot(ro.xz,rd.xz),c=dot(ro.xz,ro.xz)-R*R;float disc=b*b-a*c;if(disc<0.)return vec2(1.,-1.);
  float sq=sqrt(disc);float t0=(-b-sq)/a,t1=(-b+sq)/a;float iy=1./(abs(rd.y)<1e-5?1e-5:rd.y);float ta=(y0-ro.y)*iy,tb=(y1-ro.y)*iy;
  return vec2(max(t0,min(ta,tb)),min(t1,max(ta,tb)));}
vec3 nrm(vec3 p){vec2 e=vec2(1.,-1.)*.0008;return normalize(e.xyy*map(p+e.xyy).x+e.yyx*map(p+e.yyx).x+e.yxy*map(p+e.yxy).x+e.xxx*map(p+e.xxx).x);}
float sh(vec3 p,vec3 l){vec2 b=isect(p,l,3.3,-1.25,4.2);if(b.y<=b.x||b.y<0.)return 1.;float res=1.,t=max(b.x,.02),tm=min(b.y,7.);
  for(int i=0;i<24;i++){float d=map(p+l*t).x;res=min(res,9.*d/t);t+=clamp(d,.03,.4);if(res<.002||t>tm)break;}return clamp(res,0.,1.);}
float aoc(vec3 p,vec3 n){float o=0.,s=1.;for(int i=0;i<5;i++){float h=.02+.11*float(i);o+=(h-map(p+n*h).x)*s;s*=.72;}return clamp(1.-2.4*o,0.,1.);}
vec3 env(vec3 d){vec3 c=mix(vec3(.05,.025,.05),vec3(.5,.38,.46),smoothstep(-.3,1.,d.y));
  c+=vec3(1.,.9,.8)*smoothstep(.5,0.,length(d-normalize(vec3(-.55,.85,.65))))*2.4;
  c+=vec3(.9,.5,.75)*smoothstep(.55,0.,length(d-normalize(vec3(.9,.25,.4))))*.9;
  c+=vec3(.6,.45,1.)*smoothstep(.45,0.,length(d-normalize(vec3(.2,.5,-.95))))*1.3;return c;}
vec3 bg(vec2 uv){vec3 c=mix(vec3(.1,.035,.09),vec3(.02,.008,.03),clamp(length(uv)*.9,0.,1.));c+=vec3(.3,.1,.17)*smoothstep(.95,0.,length(uv-vec2(0.,.2)))*.45;
  for(int i=0;i<14;i++){float f=float(i);vec2 bp=vec2(sin(f*7.3+uT*.07*(1.+f*.1)),cos(f*3.7+uT*.05))*vec2(.9,.8);float br=.03+.05*h1(f);c+=vec3(1.,.72,.82)*smoothstep(br,br*.6,length(uv-bp))*.07*(.5+.5*sin(uT*.8+f));}return c;}
vec3 shade(vec3 p,vec3 rd,vec3 n,float id,float ao){
  vec3 base=vec3(.9);float rough=.5,met=0.;
  if(id<.5){float pool=smoothstep(8.,0.,length(p.xz));base=vec3(.09,.04,.075)*(.5+pool);rough=.35;}
  else if(id<1.5){base=vec3(.97,.95,.92);rough=.22;float rg=smoothstep(.02,0.,abs(abs(length(p.xz)-2.78)-.05)-.012);base=mix(base,vec3(.9,.7,.3),rg);}
  else if(id<2.5){base=vec3(1.,.78,.36);rough=.22;met=1.;}
  else if(id<3.5||(id>4.5&&id<5.5)){base=vec3(1.,.95,.88);rough=.7;
    if(id<3.5&&p.y>.3&&p.y<1.05&&length(p.xz)>2.1&&abs(n.y)<.5){float a=atan(p.x,p.z);vec2 uv=vec2(a/6.2831853*3.,(p.y-.38)/.575);
      if(uv.y>0.&&uv.y<1.){vec4 t0=texture2D(uNm,uv,-.5);vec4 tx=texture2D(uNm,uv+vec2(.0006,0.));vec4 ty=texture2D(uNm,uv+vec2(0.,.004));
        vec3 T=vec3(cos(a),0.,-sin(a));n=normalize(n-T*(tx.a-t0.a)*3.-vec3(0.,1.,0.)*(ty.a-t0.a)*1.2);
        base=mix(base,t0.rgb*1.35,t0.a);met=t0.a*.5;rough=mix(rough,.3,t0.a);}}}
  else if(id<4.5){base=vec3(.96,.62,.74);rough=.6;float fk=step(.984,h3(floor(p*36.)));base=mix(base,vec3(1.,.8,.35),fk);met=fk;}
  else if(id<6.5){base=vec3(.16,.065,.05);rough=.16;}
  else if(id<7.5){base=vec3(.99,.97,.94);rough=.18;}
  else if(id<8.5){base=vec3(.82,.04,.09);rough=.28;float sd=step(.93,h3(floor(p*68.)));base=mix(base,vec3(1.,.85,.4),sd*.8);}
  else if(id<9.5){base=vec3(.16,.5,.18);rough=.4;}
  else if(id<10.5){base=vec3(.09,.11,.34);rough=.5;}
  else if(id<11.5){vec3 q=rep(p,5.,.314159);float s=sin(q.y*70.+atan(q.x,q.z-.55)*3.);base=mix(vec3(1.,.97,.93),vec3(.95,.42,.58),step(0.,s));rough=.35;}
  else if(id<12.5){vec2 uv=vec2(.5+p.x/.8*(n.z>0.?1.:-1.),(p.y-3.22)/.34);vec4 tx=texture2D(uPlq,uv);float f=smoothstep(.5,.9,abs(n.z));base=mix(vec3(1.,.78,.36),tx.rgb,f);met=mix(1.,step(.5,tx.r)*.9,f);rough=.3;}
  else{vec2 uv=vec2(atan(p.x,p.z)/6.2831853+.5,(p.y-1.37)/.3);vec4 tx=texture2D(uBand,uv);float sd=smoothstep(.6,.95,1.-abs(n.y));base=mix(vec3(1.,.78,.36),tx.rgb,sd);met=mix(1.,step(.55,tx.r)*.8,sd);rough=.3;}
  vec3 L1=normalize(vec3(-.55,.85,.65)),L2=normalize(vec3(.9,.25,.4)),L3=normalize(vec3(.2,.5,-.95));
  float s1=sh(p+n*.012,L1);
  vec3 col=base*(vec3(1.,.93,.82)*2.1*max(dot(n,L1),0.)*s1+vec3(.9,.6,.75)*.5*max(dot(n,L2),0.)+vec3(.65,.45,.95)*1.1*max(dot(n,L3),0.)+vec3(.22,.15,.2)*(.6+.4*n.y))*ao;
  vec3 ld=vec3(0.,3.9,0.)-p;float dd=dot(ld,ld);col+=base*vec3(1.,.62,.3)*uLit*2.6*max(dot(n,normalize(ld)),0.)/(1.+dd*.9)*ao;
  col*=1.-met;
  vec3 rr=reflect(rd,n);float fr=pow(1.-max(dot(n,-rd),0.),5.);vec3 F0=mix(vec3(.04),base,met);vec3 F=F0+(1.-F0)*fr;
  col+=env(rr)*F*(1.-rough*.8)*ao;
  vec3 hv=normalize(L1-rd);col+=mix(vec3(1.),base,met)*pow(max(dot(n,hv),0.),mix(10.,200.,1.-rough))*(1.-rough)*s1*2.2;
  return col;}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uR)/uR.y;vec3 ta=vec3(0.,1.92,0.);
  vec3 ro=ta+uDist*vec3(cos(uPit)*sin(uYaw),sin(uPit),cos(uPit)*cos(uYaw));
  vec3 ww=normalize(ta-ro),uu=normalize(cross(ww,vec3(0.,1.,0.))),vv=cross(uu,ww);vec3 rd=normalize(uv.x*uu+uv.y*vv+1.9*ww);
  vec3 col=bg(uv);float tf=1e5;if(rd.y<-.0001)tf=(-1.2-ro.y)/rd.y;
  vec2 bn=isect(ro,rd,3.3,-1.25,4.2);float tH=-1.,id=-1.,glow=0.,smk=0.;float sf=smoothstep(3.6,0.,uSm)*(1.-uLit);
  if(bn.y>bn.x&&bn.y>0.){float t=max(bn.x,0.),tm=min(bn.y,tf);
    for(int i=0;i<84;i++){vec2 r=map(ro+rd*t);float st=clamp(r.x,.02,.1);glow+=uLit*exp(-gFl*12.)*st*3.35;smk+=sf*exp(-gSm*14.)*st;
      if(r.x<.0012*t){tH=t;id=r.y;break;}t+=r.x*.92;if(t>tm)break;}}
  if(tH>0.){vec3 p=ro+rd*tH;vec3 n=nrm(p);col=shade(p,rd,n,id,aoc(p,n));}
  else if(tf<1e4){vec3 p=ro+rd*tf;vec3 n=vec3(0.,1.,0.);float ao=1.-.55*smoothstep(3.6,2.9,length(p.xz))*0.;col=shade(p,rd,n,0.,1.);float fog=exp(-.045*tf);col=mix(bg(uv),col,clamp(fog,0.,1.)*smoothstep(14.,5.,length(p.xz)));}
  col+=glow*vec3(1.,.48,.12)*2.15+glow*glow*vec3(1.,.9,.52)*1.15;col=mix(col,vec3(.75,.7,.72),clamp(smk*.7,0.,.55));
  col=col*(2.51*col+.03)/(col*(2.43*col+.59)+.14);col=pow(clamp(col,0.,1.),vec3(1./2.2));col*=1.-.4*dot(uv,uv);
  gl_FragColor=vec4(col,1.);}
</script>
<script>
(function(){
const NAME='Chand',$=id=>document.getElementById(id);$('nm').textContent=NAME;
const cv=$('gl'),fx=$('fx'),fc=fx.getContext('2d');
function fail(m){const e=$('err');e.style.display='flex';e.textContent=m;console.error(m)}
const gl=cv.getContext('webgl',{antialias:false,alpha:false,powerPreference:'high-performance'})||cv.getContext('experimental-webgl');
if(!gl){fail('3D is not supported on this phone or browser. Please try the latest Chrome or Safari.');return}
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){fail('Shader error: '+gl.getShaderInfoLog(o));return null}return o}
const vs=sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'),fs=sh(gl.FRAGMENT_SHADER,$('fs').textContent);if(!vs||!fs)return;

const U={};['uR','uT','uYaw','uPit','uDist','uLit','uSm','uBand','uPlq','uNm'].forEach(k=>U[k]=gl.getUniformLocation(pr,k));
// ---- textures with the name
const FONT='"Great Vibes",cursive';
function gold(x,y0,y1){const g=x.createLinearGradient(0,y0,0,y1);g.addColorStop(0,'#fff3c4');g.addColorStop(.5,'#e8b650');g.addColorStop(1,'#b8832c');return g}
function bandCv(){const c=document.createElement('canvas');c.width=2048;c.height=256;const x=c.getContext('2d');
  let g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'#5a1230');g.addColorStop(.5,'#8a1f48');g.addColorStop(1,'#4a0f28');x.fillStyle=g;x.fillRect(0,0,2048,256);
  x.fillStyle='#e8c070';[[10,6],[240,6],[22,2],[232,2]].forEach(a=>x.fillRect(0,a[0],2048,a[1]));
  x.textAlign='center';x.textBaseline='middle';x.fillStyle=gold(x,60,200);x.font='118px '+FONT;
  for(let i=0;i<2;i++){x.fillText('Happy Birthday '+NAME,512+i*1024,128)}x.font='60px serif';[0,1024,2048].forEach(px=>x.fillText('\u2726',px,128));return c}
function plqCv(){const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'#2e1022');g.addColorStop(1,'#14060e');x.fillStyle=g;x.fillRect(0,0,512,256);
  x.strokeStyle='#e8c070';x.lineWidth=7;x.strokeRect(14,14,484,228);x.lineWidth=2;x.strokeRect(30,30,452,196);
  x.textAlign='center';x.textBaseline='middle';x.fillStyle=gold(x,70,190);x.font='150px '+FONT;x.fillText(NAME,256,138);return c}
function up(unit,cvs,loc){const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cvs);gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.uniform1i(loc,unit)}
function nameCv(){const c=document.createElement('canvas');c.width=2048;c.height=256;const x=c.getContext('2d');x.textAlign='center';x.textBaseline='middle';
  const g=x.createLinearGradient(0,60,0,210);g.addColorStop(0,'#fff3c4');g.addColorStop(.5,'#e8b650');g.addColorStop(1,'#b8832c');
